# fly.toml app configuration file generated for crypto-desk

app = 'crypto-desk-kibong'
primary_region = 'nrt'

[build]

[env]
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
