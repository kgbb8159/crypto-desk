name: Gemini briefing

on:
  schedule:
    # every 8 hours UTC
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Write portfolio config
        env:
          PORTFOLIO_CONFIG: ${{ secrets.PORTFOLIO_CONFIG }}
        run: |
          if [ -z "$PORTFOLIO_CONFIG" ]; then
            echo "PORTFOLIO_CONFIG secret missing — briefing will show 평단가 미설정"
            exit 0
          fi
          printf '%s\n' "$PORTFOLIO_CONFIG" > config.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("config.json").read_text(encoding="utf-8"))
          n = len(data.get("holdings") or {})
          print(f"portfolio holdings loaded: {n}")
          PY

      - name: Run briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          LLM_PROVIDER: gemini
          TELEGRAM_ENABLED: "false"
        run: python main.py --no-telegram

      - name: Publish report for Pages
        run: |
          mkdir -p reports/history
          if [ -f reports/latest.md ]; then
            stamp=$(date -u +%Y-%m-%d_%H%M%S)
            cp reports/latest.md "reports/history/briefing-${stamp}.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md reports/history || true
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update Gemini briefing $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
